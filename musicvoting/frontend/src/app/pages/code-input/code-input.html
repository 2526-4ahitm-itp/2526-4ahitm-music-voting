<!--
  Join page in the stage look (shared/stage.css), like every other page
  (web-ui spec "Every Web Page Uses the Stage Look").
-->
<div class="host-stage code-page">
  <header class="host-top">
    <button type="button" class="back-to-home host-icon-btn" aria-label="Zurück" (click)="goBack()">
      <mv-icon name="arrow-left" [size]="22" />
    </button>
    <span class="host-title">MusicVoting</span>
    <mv-theme-toggle />
  </header>

  <main class="host-content code-input-wrapper">
    <div class="stage-column">
    <h1 class="stage-heading">Party beitreten!</h1>
    <p class="stage-lead subtitle" id="code-hint">Gib den 5-stelligen Code vom TV-Bildschirm ein, um der Party beizutreten.</p>

    <div class="code-container" role="group" aria-label="Party-Code" aria-describedby="code-hint" (paste)="handlePaste($event)">
      <input #i1 type="text"
             maxlength="1"
             inputmode="numeric"
             pattern="[0-9]*"
             autocomplete="one-time-code"
             aria-label="Ziffer 1"
             (input)="moveFocus($event, i2)"
             (keydown)="handleDelete($event, null)">

      <input #i2 type="text"
             maxlength="1"
             inputmode="numeric"
             pattern="[0-9]*"
             aria-label="Ziffer 2"
             (input)="moveFocus($event, i3)"
             (keydown)="handleDelete($event, i1)">

      <input #i3 type="text"
             maxlength="1"
             inputmode="numeric"
             pattern="[0-9]*"
             aria-label="Ziffer 3"
             (input)="moveFocus($event, i4)"
             (keydown)="handleDelete($event, i2)">

      <input #i4 type="text"
             maxlength="1"
             inputmode="numeric"
             pattern="[0-9]*"
             aria-label="Ziffer 4"
             (input)="moveFocus($event, i5)"
             (keydown)="handleDelete($event, i3)">

      <input #i5 type="text"
             maxlength="1"
             inputmode="numeric"
             pattern="[0-9]*"
             aria-label="Ziffer 5"
             (input)="checkCode($event)"
             (keydown)="handleDelete($event, i4)">
    </div>

    <button type="button" class="paste-button host-btn large" (click)="pasteFromClipboard()">
      <mv-icon name="copy" [size]="20" /> Code aus Zwischenablage einfügen
    </button>

    <!-- Live regions exist up front so screen readers announce changes. -->
    <div class="status" aria-live="polite">
      @if (resolving) {
        <p class="searching"><mv-spinner label="" /> <span>Party wird gesucht …</span></p>
      }
    </div>
    <div role="alert">
      @if (showError) {
        <p class="error-message">
          <span>{{ errorMessage }}</span>
          @if (isNotFound) {
            <span class="error-hint">{{ notFoundHint }}</span>
          }
        </p>
      }
    </div>
    </div>
  </main>
</div>
