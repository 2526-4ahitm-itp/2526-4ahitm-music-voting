<!--
  "Party erstellen" in the stage look (shared/stage.css), like every other
  page (web-ui spec "Every Web Page Uses the Stage Look"). The provider
  choice follows host spec "Only Supported Providers Are Selectable".
-->
<div class="host-stage">
  <header class="host-top">
    <button type="button" class="host-icon-btn" aria-label="Zurück zu den Gastgeber-Optionen" (click)="goBack()">
      <mv-icon name="arrow-left" [size]="22" />
    </button>
    <span class="host-title">MusicVoting</span>
    <mv-theme-toggle />
  </header>

  <main class="host-content create-content">
    <div class="stage-column">
      <h1 class="stage-heading">Party erstellen</h1>
      <p class="stage-lead">Wähle deinen Musikanbieter und starte deine Party.</p>

      <fieldset class="providers">
        <legend class="providers-legend">Musikanbieter</legend>

        <label class="provider">
          <input type="radio" name="provider" value="spotify" checked />
          <span class="provider-icon"><mv-icon name="music" [size]="24" /></span>
          <span class="provider-text">
            <strong>Spotify</strong>
            <small>Du brauchst Spotify Premium.</small>
          </span>
        </label>

        <!-- Shown so hosts know it is coming, but not selectable yet. -->
        <label class="provider disabled">
          <input type="radio" name="provider" value="youtube" disabled />
          <span class="provider-icon"><mv-icon name="monitor-play" [size]="24" /></span>
          <span class="provider-text">
            <strong>YouTube (bald verfügbar)</strong>
          </span>
        </label>
      </fieldset>

      <div role="alert">
        @if (error) {
          <p class="host-status error">{{ error }}</p>
        }
      </div>

      <button class="create-btn host-btn large primary" type="button" (click)="create()" [disabled]="isLoading">
        @if (isLoading) {
          <mv-spinner label="" /> Wird erstellt …
        } @else {
          Party erstellen
        }
      </button>
    </div>
  </main>
</div>
