<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Cover fallback (web-ui spec "Cover Images Have a Working Fallback"):
       dark brand tile, purple to deep coral, with the Lucide "music" note
       as a line drawing, so a missing cover still looks like album art. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A0B38"/>
      <stop offset="0.6" stop-color="#5A0272"/>
      <stop offset="1" stop-color="#7A2A33"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#bg)"/>
  <g transform="translate(90 90) scale(5)" fill="none" stroke="#FBF4FF" stroke-opacity="0.72"
     stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18V5l12-2v13"/>
    <circle cx="6" cy="18" r="3"/>
    <circle cx="18" cy="16" r="3"/>
  </g>
</svg>
