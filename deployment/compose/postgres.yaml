services:
  postgres:
    container_name: postgres
    image: postgres:19-alpine
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ stores data under /var/lib/postgresql/<major>/docker -> mount one level up.
      # New volume name: an old postgres_data volume holds PostgreSQL 16 files 19 cannot open.
      - postgres_data_pg19:/var/lib/postgresql
      - ../../musicvoting/backend/setup.sql:/docker-entrypoint-initdb.d/setup.sql
    environment:
      - POSTGRES_DB=musicvoting
      - POSTGRES_USER=musicvoting
      - POSTGRES_PASSWORD=musicvoting
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicvoting -d musicvoting"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_pg19:
