# Stand-Datei für die Präsentation "Projektstatus" (hugo/content/status/).
#
# Beim Erneuern:
#   1. `stand` auf das heutige Datum setzen.
#   2. Ist-/Soll-Punkte anpassen.
#   3. Screenshots neu machen: siehe hugo/scripts/status-screenshots/README.md
#   4. Texte der Screenshots prüfen (screens[].text).

stand: 2026-11-17

# ---------------------------------------------------------------------------
# Ist-Zustand: was heute funktioniert
# ---------------------------------------------------------------------------
ist:
  - icon: "👑"
    title: Gastgeber
    text: Party erstellen, Spotify-Login, Standard-Playlist und Blocklist wählen, Player starten, Wiedergabe steuern, Songs entfernen oder sperren, Party beenden.
  - icon: "📱"
    title: Gäste
    text: Beitritt per QR-Code oder 5-stelligem PIN, anonym. Sehen, was läuft und auf welchem Platz ihr Song steht; Songs suchen, wünschen und liken – alles live.
  - icon: "🖥️"
    title: Player (TV)
    text: Spielt über das Spotify Web Playback SDK, zeigt QR-Code, aktuellen Song mit Fortschritt und die Warteschlange.
  - icon: "🚫"
    title: Blocklist
    text: Der Host sperrt Wörter, Künstler und Songs für die Party – vorab oder während der Party. Gäste können gesperrte Songs nicht hinzufügen.
  - icon: "🎨"
    title: Ein Design für alles
    text: Dunkle Bühne mit Markenlicht auf TV, Host und Handy, Hell/Dunkel umschaltbar, barrierearm (WCAG 2.2 AA).
  - icon: "🔁"
    title: Musik geht nie aus
    text: Bei leerer Warteschlange wird automatisch nachgefüllt (Standard-Playlist → ähnliche Songs → Top-Charts → Suche).
  - icon: "🍏"
    title: iOS-App
    text: Gast- und Host-Ansicht in SwiftUI
  - icon: "🚀"
    title: Live & automatisiert
    text: Läuft im HTL-Kubernetes-Cluster, jeder Push auf main wird automatisch gebaut und deployed.


# ---------------------------------------------------------------------------
# Soll-Zustand: wohin es geht
# ---------------------------------------------------------------------------
soll:
  - title: Mehrere Musikanbieter
    icon: "🎵"
    items:
      - Suche und Wiedergabe auch über andere Anbieter
      - z. B. Amazon Music, YouTube Music, …
  - title: Karaoke-Modus
    icon: "🎤"
    items:
      - Songtexte am Player (TV) anzeigen – zum Mitsingen

# ---------------------------------------------------------------------------
# Screenshots: Reihenfolge = Reihenfolge der Folien.
# file: Dateiname in hugo/content/status/screens/ (vom Skript erzeugt)
# device: mobile | desktop (bestimmt Fenstergröße im Skript und Rahmen auf der Folie)
# search: optionaler Suchbegriff, den das Skript vor dem Screenshot eintippt
# submit: false = nach dem Suchbegriff kein Enter drücken
# ---------------------------------------------------------------------------
screens:
  - file: home.png
    route: /
    device: mobile
    role: Alle
    title: Startseite
    text: Einstieg für alle – als Gast oder als Gastgeber weiter.
  - file: host-options.png
    route: /host-options
    device: mobile
    role: Gastgeber
    title: Gastgeber-Optionen
    text: Neue Party erstellen oder mit der Gastgeber-PIN Dashboard bzw. Player einer laufenden Party öffnen.
  - file: create-party.png
    route: /create-party
    device: mobile
    role: Gastgeber
    title: Party erstellen
    text: Anbieter wählen – derzeit Spotify (Premium nötig), YouTube folgt. Danach geht es zum Spotify-Login.
  - file: select-playlist.png
    route: /select-playlist
    device: mobile
    role: Gastgeber
    title: Standard-Playlist
    text: Nach dem Login wählt der Host optional eine Playlist, aus der nachgefüllt wird, wenn niemand etwas wünscht.
  - file: select-blocklist.png
    route: /select-blocklist
    device: desktop
    role: Gastgeber
    title: Blocklist
    search: live   # wird vom Skript ins Suchfeld getippt
    submit: false  # kein Enter – sonst würde „live“ wirklich gesperrt
    text: Ein Suchfeld für Wörter, Künstler und Songs – zuerst „Wort sperren“, dann passende Künstler und Songs. Optional, auch während der Party änderbar.
  - file: party-ready.png
    route: /party-ready
    device: mobile
    role: Gastgeber
    title: Party ist bereit
    text: Letzter Schritt – den Player auf dem Gerät am TV öffnen. Sobald er verbunden ist, heißt es „Party ist live 🎉“.
  - file: dashboard.png
    route: /dashboard
    device: desktop
    role: Gastgeber
    title: Host-Dashboard
    text: Aktueller Song mit Steuerung, Warteschlange mit Rang und Likes, Entfernen oder Sperren, QR-Code und Voting-PIN. Navigation als feste Leiste, Gastgeber-PIN verborgen bis „Anzeigen“.
  - file: startpage.png
    route: /startpage
    device: desktop
    role: Player (TV)
    title: Player
    text: Läuft am Fernseher und spielt die Musik ab – vom Sofa lesbar, mit großem QR-Code, Voting-PIN und den nächsten fünf Songs.
  - file: code-input.png
    route: /code
    device: mobile
    role: Gast
    title: Beitreten
    text: Gäste geben den 5-stelligen PIN ein – oder landen direkt hier, wenn sie den QR-Code scannen.
  - file: voting.png
    route: /voting
    device: mobile
    role: Gast
    title: Warteschlange
    text: Was gerade läuft, darunter die Warteschlange mit Platz und Likes. Ein Tipp auf das Herz liked oder nimmt das Like zurück.
  - file: guest-search.png
    route: /guest
    device: mobile
    role: Gast
    title: Song suchen
    search: Daft Punk   # wird vom Skript ins Suchfeld getippt
    text: Suche bei Spotify; „+“ fügt den Song hinzu, danach zeigt ein Hinweis, auf welchem Platz er steht.
