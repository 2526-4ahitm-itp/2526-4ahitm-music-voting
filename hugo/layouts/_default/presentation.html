<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <title>{{ .Title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" />

    <!-- Reveal.js (Version gepinnt, damit ein Major-Update die Folien nicht bricht) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.css" />

    <style>
        /* Farben aus dem Hugo-Farbschema (assets/css/schemes/custom.css) */
        :root {
            --mv-bg: #0f172a;
            --mv-surface: #1e293b;
            --mv-border: #334155;
            --mv-text: #f1f5f9;
            --mv-muted: #94a3b8;
            --mv-primary: #8b5cf6;
            --mv-primary-soft: #c4b5fd;
            --mv-accent: #34d399;

            --r-background-color: var(--mv-bg);
            --r-main-font: "Inter", system-ui, sans-serif;
            --r-main-font-size: 34px;
            --r-main-color: var(--mv-text);
            --r-heading-font: "Inter", system-ui, sans-serif;
            --r-heading-color: #ffffff;
            --r-heading-font-weight: 800;
            --r-heading-text-transform: none;
            --r-heading-letter-spacing: -0.02em;
            --r-link-color: var(--mv-accent);
            --r-link-color-hover: #6ee7b7;
            --r-selection-background-color: var(--mv-primary);
        }

        .reveal-viewport {
            background: radial-gradient(ellipse at top left, #2e1065 0%, var(--mv-bg) 55%);
        }

        .reveal h1 { font-size: 3.2em; }
        .reveal h2 { font-size: 1.9em; margin-bottom: 0.6em; }
        .reveal h3 { color: var(--mv-primary-soft); font-weight: 600; }
        .reveal strong { color: var(--mv-primary-soft); }

        .reveal .kicker {
            margin: 0 0 0.3em;
            color: var(--mv-accent);
            font-size: 0.55em;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        .reveal .lead { color: var(--mv-muted); font-size: 0.9em; }

        .reveal ul { display: block; margin-left: 1em; }
        .reveal ul li { margin: 0.45em 0; line-height: 1.35; }
        .reveal ul li::marker { color: var(--mv-primary); }

        /* Karten-Raster für Rollen, Stack usw. */
        .reveal .cards {
            display: grid;
            grid-template-columns: repeat(var(--cols, 3), 1fr);
            gap: 0.6em;
            margin-top: 0.4em;
            text-align: left;
        }
        .reveal .card {
            background: var(--mv-surface);
            border: 1px solid var(--mv-border);
            border-top: 4px solid var(--mv-primary);
            border-radius: 14px;
            padding: 0.7em 0.8em;
            font-size: 0.62em;
            line-height: 1.4;
        }
        .reveal .card .icon { font-size: 1.8em; line-height: 1; }
        .reveal .card h4 {
            margin: 0.35em 0 0.25em;
            font-size: 1.15em;
            color: #fff;
            text-transform: none;
        }
        .reveal .card p { margin: 0; color: var(--mv-muted); }
        .reveal .card.accent { border-top-color: var(--mv-accent); }

        /* Nummerierte Abläufe */
        .reveal .steps {
            display: flex;
            gap: 0.4em;
            align-items: stretch;
            justify-content: center;
            font-size: 0.6em;
        }
        .reveal .steps .step {
            flex: 1;
            background: var(--mv-surface);
            border: 1px solid var(--mv-border);
            border-radius: 12px;
            padding: 0.7em 0.5em;
        }
        .reveal .steps .num {
            display: inline-grid;
            place-items: center;
            width: 1.8em;
            height: 1.8em;
            border-radius: 50%;
            background: var(--mv-primary);
            color: #fff;
            font-weight: 800;
            margin-bottom: 0.4em;
        }
        .reveal .steps .arrow { align-self: center; color: var(--mv-muted); flex: 0; }

        .reveal .big-link {
            display: inline-block;
            margin-top: 0.6em;
            padding: 0.4em 0.9em;
            border: 2px solid var(--mv-accent);
            border-radius: 999px;
            font-weight: 600;
        }

        .reveal .team { display: flex; gap: 1.2em; justify-content: center; margin-top: 0.8em; }
        .reveal .team .member { font-size: 0.7em; }
        .reveal .team .role { display: block; color: var(--mv-muted); font-size: 0.8em; }

        .reveal .powered-by {
            display: inline-flex;
            align-items: center;
            gap: 0.5em;
            margin-top: 1.4em;
            color: var(--mv-muted);
            font-size: 0.45em;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .reveal .powered-by img { height: 2.6em; margin: 0; border-radius: 6px; }

        .reveal .slide-number { background: transparent; color: var(--mv-muted); font-family: var(--r-main-font); left: 16px; right: auto; bottom: 12px; }
        .reveal .progress { color: var(--mv-primary); height: 4px; }

        .back-to-docs {
            position: fixed;
            top: 14px;
            left: 16px;
            z-index: 30;
            color: var(--mv-muted);
            font: 600 13px/1 "Inter", system-ui, sans-serif;
            text-decoration: none;
            opacity: 0.7;
        }
        .back-to-docs:hover { opacity: 1; color: var(--mv-text); }

        /* ---- Projektstatus: Hinweise, Soll-Karten ---- */
        .reveal .limits {
            margin-top: 0.8em;
            padding: 0.5em 0.8em;
            border-left: 4px solid #f59e0b;
            background: rgba(245, 158, 11, 0.08);
            border-radius: 8px;
            color: var(--mv-muted);
            font-size: 0.5em;
            text-align: left;
        }
        .reveal .limits strong { color: #fbbf24; }
        .reveal .cards.soll .card ul { margin: 0.3em 0 0 1em; }
        .reveal .cards.soll .card li { margin: 0.25em 0; color: var(--mv-muted); line-height: 1.35; }
        .reveal .stand-badge {
            display: inline-block;
            margin-top: 0.8em;
            padding: 0.3em 0.9em;
            border: 1px solid var(--mv-border);
            border-radius: 999px;
            background: var(--mv-surface);
            color: var(--mv-muted);
            font-size: 0.5em;
        }
        .reveal .stand-badge strong { color: var(--mv-accent); }

        /* ---- Screenshots ---- */
        .reveal .screen-slide.present {
            display: grid !important;
            grid-template-columns: auto 1fr;
            gap: 1.4em;
            align-items: center;
            text-align: left;
        }
        .reveal .screen-slide.desktop.present { grid-template-columns: 1.7fr 1fr; }
        .reveal .screen-frame {
            background: #020617;
            border: 1px solid var(--mv-border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            overflow: hidden;
            justify-self: center;
        }
        .reveal .screen-frame.mobile { width: 300px; height: 620px; border: 10px solid #020617; border-radius: 38px; }
        .reveal .screen-frame.desktop { width: 100%; border-radius: 12px; border-top: 26px solid #1e293b; position: relative; }
        .reveal .screen-frame.desktop::before {
            content: "● ● ●";
            position: absolute;
            top: -22px;
            left: 12px;
            color: var(--mv-muted);
            font-size: 12px;
            letter-spacing: 2px;
        }
        .reveal .screen-frame img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; margin: 0; max-width: none; max-height: none; }
        .reveal .screen-frame.desktop img { height: auto; }
        .reveal .screen-missing {
            display: grid;
            place-items: center;
            height: 100%;
            min-height: 300px;
            color: var(--mv-muted);
            font-size: 0.5em;
            text-align: center;
        }
        .reveal .screen-text h2 { margin: 0.2em 0 0.4em; font-size: 1.5em; }
        .reveal .screen-text p { font-size: 0.72em; line-height: 1.45; }
        .reveal .screen-text .kicker { font-size: 0.45em; }
        .reveal .role-badge {
            display: inline-block;
            padding: 0.15em 0.7em;
            border-radius: 999px;
            background: rgba(139, 92, 246, 0.2);
            color: var(--mv-primary-soft);
            font-size: 0.45em;
            font-weight: 600;
        }
        .reveal .screen-meta { color: var(--mv-muted); font-size: 0.45em !important; }
        .reveal .screen-meta code { color: var(--mv-accent); }

        /* ---- Architektur-Diagramm ---- */
        .reveal .arch-svg { width: 100%; max-height: 560px; }
        .reveal .arch-svg text { font-family: "Inter", system-ui, sans-serif; fill: var(--mv-text); }
        .reveal .arch-svg .muted { fill: var(--mv-muted); }
        .reveal .arch-svg .box { fill: var(--mv-surface); stroke: var(--mv-border); stroke-width: 2; }
        .reveal .arch-svg .box.primary { stroke: var(--mv-primary); }
        .reveal .arch-svg .box.accent { stroke: var(--mv-accent); }
        .reveal .arch-svg .group { fill: none; stroke: var(--mv-border); stroke-dasharray: 6 6; }
        .reveal .arch-svg .edge { stroke: var(--mv-muted); stroke-width: 2; fill: none; }
        .reveal .arch-svg .edge.sse { stroke: var(--mv-accent); stroke-dasharray: 5 5; }

        /* ---- Ablauf einer Party: Zeitleiste ---- */
        .reveal .journey {
            --host: var(--mv-primary);
            --guest: var(--mv-accent);
            --tv: #fbbf24;
            position: relative;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            margin-top: 2.2em;
        }
        .reveal .journey::before {
            content: "";
            position: absolute;
            left: 8.33%;
            right: 8.33%;
            top: 1.32em; /* Kreismitte: 2.2em × 1.2em / 2 */
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--host) 0%, var(--host) 20%, var(--guest) 40%, var(--guest) 80%, var(--tv) 100%);
            transform: translateY(-50%);
        }
        .reveal .journey .stop { --c: var(--host); position: relative; display: flex; flex-direction: column; align-items: center; }
        .reveal .journey .stop.guest { --c: var(--guest); }
        .reveal .journey .stop.tv { --c: var(--tv); }
        .reveal .journey .role {
            position: absolute;
            bottom: calc(100% + 0.6em);
            white-space: nowrap;
            font-size: 0.4em;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--c);
        }
        .reveal .journey .dot {
            display: grid;
            place-items: center;
            width: 2.2em;
            height: 2.2em;
            border-radius: 50%;
            font-size: 1.2em;
            background: var(--mv-bg);
            border: 4px solid var(--c);
            box-shadow: 0 0 24px color-mix(in srgb, var(--c) 45%, transparent);
        }
        .reveal .journey .stop p {
            margin: 0.8em 0.3em 0;
            font-size: 0.6em;
            font-weight: 600;
            line-height: 1.3;
            color: var(--mv-text);
        }
        .reveal .journey-loop { display: block; width: 100%; margin-top: 0.3em; overflow: visible; }
        .reveal .journey-loop text { font-family: "Inter", system-ui, sans-serif; font-weight: 600; }

        @media (max-width: 700px) {
            .reveal .screen-slide.present,
            .reveal .screen-slide.desktop.present { grid-template-columns: 1fr; }
            .reveal .journey { grid-template-columns: repeat(3, 1fr); row-gap: 1em; }
            .reveal .journey::before, .reveal .journey-loop { display: none; }
        }

        @media (max-width: 700px) {
            .reveal .cards { grid-template-columns: 1fr; }
            .reveal .steps { flex-direction: column; }
            .reveal .steps .arrow { display: none; }
        }
    </style>
</head>
<body>
<a class="back-to-docs" href="{{ "" | relURL }}">← Zur Doku</a>

<div class="reveal">
    <div class="slides">
        {{ .Content }}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
<script>
    Reveal.initialize({
        hash: true,
        slideNumber: 'c/t',
        progress: true,
        controls: true,
        center: true,
        transition: 'slide',
        backgroundTransition: 'fade',
        plugins: [RevealNotes]
    });
</script>
</body>
</html>
